<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derivada Directa_JEREMY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0F172A,#1E3A8A,#2563EB);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    padding:30px;
    border-radius:25px;
    max-width:850px;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.15);
}

h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
    font-size:32px;
}

input{
    width:100%;
    padding:18px;
    font-size:20px;
    border:none;
    border-radius:18px;
    outline:none;
    margin-bottom:15px;
    background: rgba(255,255,255,0.92);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    font-size:20px;
    cursor:pointer;
    margin-bottom:12px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform: translateY(-2px);
}

.btn-calcular{
    background: linear-gradient(90deg,#38BDF8,#2563EB);
    color:white;
    box-shadow:0 6px 20px rgba(37,99,235,0.45);
}

.btn-calcular:hover{
    box-shadow:0 10px 25px rgba(37,99,235,0.6);
}

.btn-limpiar{
    background: rgba(255,255,255,0.18);
    color:white;
    border:1px solid rgba(255,255,255,0.2);
}

.paso{
    background: rgba(255,255,255,0.95);
    padding:18px;
    border-left:6px solid #2563EB;
    border-radius:15px;
    margin-top:15px;
    line-height:1.8;
    color:#0F172A;
    box-shadow:0 5px 15px rgba(0,0,0,0.12);
}

.resultado{
    background: linear-gradient(90deg,#38BDF8,#2563EB);
    color:white;
    padding:18px;
    border-radius:18px;
    text-align:center;
    font-weight:bold;
    font-size:22px;
    margin-top:20px;
    box-shadow:0 8px 20px rgba(37,99,235,0.4);
}

.error{
    background:#EF4444;
    color:white;
    padding:15px;
    border-radius:15px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h1>🔵 Derivada Directa_JEREMY_RAMIREZ JIMENEZ</h1>

    <input type="text" id="funcion"
    placeholder="Ejemplo: 8x^4+3x^2-6x+10"
    value="8x^4+3x^2-6x+10">

    <button class="btn-calcular" onclick="resolver()">
        Calcular Derivada
    </button>

    <button class="btn-limpiar" onclick="limpiar()">
        Limpiar
    </button>

    <div id="proceso"></div>
    <div id="resultado"></div>
</div>

<script>

function resolver() {

    try {

        let funcion =
        document.getElementById("funcion")
        .value.replace(/\s/g, "");

        let terminos =
        funcion.match(/[+-]?[^+-]+/g);

        let resultado = [];

        let proceso = `
        <div class="paso">
        <b>FÓRMULA DE DERIVADA DIRECTA</b><br><br>

        Si tienes:<br>
        <b>ax^n</b><br><br>

        La fórmula es:<br>
        <b>f'(x)=a·n·x^(n-1)</b><br><br>

        Donde:<br>
        a = coeficiente<br>
        n = exponente
        </div>
        `;

        for(let termino of terminos){

            if(termino.includes("x")){

                let coeficiente = 1;
                let exponente = 1;

                let partes = termino.split("x");

                if(partes[0] === "" ||
                   partes[0] === "+"){
                    coeficiente = 1;
                }
                else if(partes[0] === "-"){
                    coeficiente = -1;
                }
                else{
                    coeficiente =
                    parseFloat(partes[0]);
                }

                if(termino.includes("^")){
                    exponente =
                    parseInt(
                    termino.split("^")[1]);
                }
                else{
                    exponente = 1;
                }

                let nuevoCoef =
                coeficiente * exponente;

                let nuevoExp =
                exponente - 1;

                let resultadoTermino = "";

                if(nuevoExp > 1){
                    resultadoTermino =
                    `${nuevoCoef}x^${nuevoExp}`;
                }
                else if(nuevoExp === 1){
                    resultadoTermino =
                    `${nuevoCoef}x`;
                }
                else{
                    resultadoTermino =
                    `${nuevoCoef}`;
                }

                proceso += `
                <div class="paso">

                <b>Término:</b>
                ${termino}<br><br>

                <b>Paso 1: Identificar datos</b><br>
                Coeficiente = ${coeficiente}<br>
                Exponente = ${exponente}<br><br>

                <b>Paso 2: Fórmula</b><br>
                f'(x)=a·n·x^(n-1)<br><br>

                <b>Paso 3: Sustituimos</b><br>
                (${coeficiente})(${exponente})
                x^(${exponente}-1)<br><br>

                <b>Paso 4: Multiplicamos</b><br>
                ${coeficiente} × ${exponente}
                = ${nuevoCoef}<br><br>

                <b>Paso 5: Restamos exponente</b><br>
                ${exponente} - 1
                = ${nuevoExp}<br><br>

                <b>Resultado:</b><br>
                <b>${resultadoTermino}</b>

                </div>`;

                resultado.push(
                resultadoTermino);

            } else {

                proceso += `
                <div class="paso">
                <b>Término:</b>
                ${termino}<br><br>

                Es una constante.<br>
                La derivada de una constante es:<br>
                <b>0</b>
                </div>`;
            }
        }

        document
        .getElementById("proceso")
        .innerHTML = proceso;

        document
        .getElementById("resultado")
        .innerHTML =
        `<div class="resultado">
        f'(x) =
        ${resultado.join(" + ")
        .replace(/\+\s-/g,"- ")}
        </div>`;

    }

    catch(error){

        document
        .getElementById("resultado")
        .innerHTML =
        `<div class="error">
        Error en la función
        </div>`;
    }
}

function limpiar(){
    document
    .getElementById("funcion")
    .value = "";

    document
    .getElementById("proceso")
    .innerHTML = "";

    document
    .getElementById("resultado")
    .innerHTML = "";
}

window.onload = resolver;

</script>

</body>
</html>
